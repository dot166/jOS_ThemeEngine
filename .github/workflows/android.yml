name: Android CI

on:
  push:
    branches: [ "jOS-15.1" ]
  pull_request:
    branches: [ "jOS-15.1" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure git
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew assembleRelease
    - name: Copy files for AOSP
      run: cp app/build/generated/aboutLibraries/release/res/raw/aboutlibraries.json app/res-aosp/raw/aboutlibraries.json

    - name: Commit changes
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/jOS-15.1' && github.repository == 'dot166/jOS_ThemeEngine' }}
      run: |
        git add .
        git commit -m "Publish dependencies for AOSP" || true

    - name: Push changes to repo
      uses: ad-m/github-push-action@master
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/jOS-15.1' && github.repository == 'dot166/jOS_ThemeEngine' }}
      with:
        branch: ${{ github.ref }}
